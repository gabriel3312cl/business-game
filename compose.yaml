name: business-game

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      BUSINESS_GAME_ENVIRONMENT: ${BUSINESS_GAME_ENVIRONMENT:-development}
      BUSINESS_GAME_DATABASE_URL: postgresql+asyncpg://${BUSINESS_GAME_POSTGRES_USER:-business_game}:${BUSINESS_GAME_POSTGRES_PASSWORD:-local_business_game_only}@postgres:5432/${BUSINESS_GAME_POSTGRES_DB:-business_game}
      BUSINESS_GAME_REDIS_URL: redis://redis:6379/0
      BUSINESS_GAME_JWT_SECRET: ${BUSINESS_GAME_JWT_SECRET:-development-only-change-this-secret}
      BUSINESS_GAME_ACCESS_TOKEN_MINUTES: ${BUSINESS_GAME_ACCESS_TOKEN_MINUTES:-30}
      BUSINESS_GAME_SESSION_DAYS: ${BUSINESS_GAME_SESSION_DAYS:-30}
      BUSINESS_GAME_AUTH_LOGIN_ATTEMPTS_PER_MINUTE: ${BUSINESS_GAME_AUTH_LOGIN_ATTEMPTS_PER_MINUTE:-30}
      BUSINESS_GAME_AUTH_REGISTRATIONS_PER_MINUTE: ${BUSINESS_GAME_AUTH_REGISTRATIONS_PER_MINUTE:-20}
      BUSINESS_GAME_PACKS_DIR: /app/content/packs
      BUSINESS_GAME_DEEPSEEK_API_KEY: ${BUSINESS_GAME_DEEPSEEK_API_KEY}
      BUSINESS_GAME_DEEPSEEK_MODEL: ${BUSINESS_GAME_DEEPSEEK_MODEL}
      BUSINESS_GAME_DEEPSEEK_BASE_URL: ${BUSINESS_GAME_DEEPSEEK_BASE_URL}
      BUSINESS_GAME_DEEPSEEK_TIMEOUT_SECONDS: ${BUSINESS_GAME_DEEPSEEK_TIMEOUT_SECONDS}
      BUSINESS_GAME_DEEPSEEK_THINKING_ENABLED: ${BUSINESS_GAME_DEEPSEEK_THINKING_ENABLED}
      BUSINESS_GAME_DEEPSEEK_MAX_TOKENS: ${BUSINESS_GAME_DEEPSEEK_MAX_TOKENS}
      BUSINESS_GAME_DEEPSEEK_TEMPERATURE: ${BUSINESS_GAME_DEEPSEEK_TEMPERATURE}
      BUSINESS_GAME_ADVISOR_REQUESTS_PER_MINUTE: ${BUSINESS_GAME_ADVISOR_REQUESTS_PER_MINUTE}
      BUSINESS_GAME_ADVISOR_HISTORY_LIMIT: ${BUSINESS_GAME_ADVISOR_HISTORY_LIMIT}
      BUSINESS_GAME_ADVISOR_CONTEXT_MESSAGES: ${BUSINESS_GAME_ADVISOR_CONTEXT_MESSAGES}
      BUSINESS_GAME_API_RELOAD: "true"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${BUSINESS_GAME_API_PORT:-48010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - business_game_internal
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./content:/app/content:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      BUSINESS_GAME_VITE_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${BUSINESS_GAME_FRONTEND_PORT:-43173}:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - business_game_internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BUSINESS_GAME_POSTGRES_DB:-business_game}
      POSTGRES_USER: ${BUSINESS_GAME_POSTGRES_USER:-business_game}
      POSTGRES_PASSWORD: ${BUSINESS_GAME_POSTGRES_PASSWORD:-local_business_game_only}
    ports:
      - "127.0.0.1:${BUSINESS_GAME_POSTGRES_PORT:-45432}:5432"
    volumes:
      - business_game_postgres_data:/var/lib/postgresql/data
    networks:
      - business_game_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BUSINESS_GAME_POSTGRES_USER:-business_game} -d ${BUSINESS_GAME_POSTGRES_DB:-business_game}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${BUSINESS_GAME_REDIS_PORT:-46379}:6379"
    volumes:
      - business_game_redis_data:/data
    networks:
      - business_game_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  business_game_internal:
    name: business-game-internal

volumes:
  business_game_postgres_data:
    name: business-game-postgres-data
  business_game_redis_data:
    name: business-game-redis-data
